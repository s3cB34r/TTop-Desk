name: Feature request
description: Suggest a focused improvement for TTop Desk.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. TTop Desk 0.9.x targets Plasma 5.27; Plasma 6 work is planned separately.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome rather than an implementation mandate.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related Plasma widgets.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Linux Mint 22, Plasma 5.27.12, Qt 5.15
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included private paths, tokens, or sensitive process command lines.
          required: true
